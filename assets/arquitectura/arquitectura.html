<!DOCTYPE html>
<html class="%%TEMA%%" lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquitectura de plataforma SMUCORP</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --line: #d8d8d4; --accent: #2f6feb; --crit: #c2410c; --int: #0f766e; --ext: #7c3aed;
  }
  html.tema-oscuro {
    --bg: #131313; --panel: #1d1d20; --text: #e9e9e7; --muted: #9a9a98;
    --line: #34343a; --accent: #5b93ff; --crit: #fb923c; --int: #2dd4bf; --ext: #a78bfa;
  }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  svg { width: 100%; height: auto; display: block; }
  .band { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .ext { stroke-dasharray: 6 4; }
  .ops { fill: none; stroke-dasharray: 4 4; }
  .t { font-size: 19px; font-weight: 700; }
  .h { font-size: 15px; font-weight: 700; }
  .s { font-size: 11.5px; }
  .b { font-size: 11px; fill: var(--muted); }
  .m { font-size: 10.5px; fill: var(--muted); }
  .fl { stroke: var(--accent); stroke-width: 2; fill: none; marker-end: url(#flecha); }
  .fld { stroke: var(--muted); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#flecha-m); }
  .crit { fill: var(--crit); } .int { fill: var(--int); } .extc { fill: var(--ext); }
</style>
</head>
<body>
<svg viewBox="0 0 1240 1015" role="img" aria-label="Esquema de arquitectura por capas">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="flecha-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <text class="s" x="430" y="158">•  WebServices REST y lotes SFTP diarios  <tspan class="m">(+4)</tspan></text>

  <text class="m" x="74" y="203">HTTPS</text>

  <text class="s" x="130" y="267">•  Firewalls FortiGate 100E (HA)</text>
  <text class="s" x="130" y="284">•  VPN IPSec Site-to-Site (17 túneles)</text>

  <rect class="band ops" x="30" y="835" width="1180" height="140" rx="10"/>
  <text class="h" x="52" y="861">7 · Operación y monitoreo</text>
  <text class="b" x="1188" y="861" text-anchor="end">6 servicios · 3 internos / 3 externos · 8 servidores · 6 críticos</text>
  <text class="s" x="52" y="889">•  Nagios XI</text>
  <text class="s" x="52" y="906">•  Vzor Suite</text>
  <text class="s" x="420" y="889">•  New Relic</text>

  <text class="s" x="790" y="889">•  Azure DevOps</text>
  <text class="s" x="790" y="906">•  vCloud GTD (IaaS 2.0 / 2.1)</text>

  <line class="fld" x1="350" y1="831" x2="350" y2="810"/>
  <text class="m" x="362" y="828">monitorea</text>
  <line class="fld" x1="650" y1="831" x2="650" y2="810"/>

  <!-- Leyenda -->
  <circle class="crit" cx="36" cy="1000" r="5"/>
  <text class="m" x="48" y="1004">Servidor crítico (43)</text>
  <circle class="int" cx="196" cy="1000" r="5"/>
  <text class="m" x="208" y="1004">Interno</text>
  <circle class="extc" cx="280" cy="1000" r="5"/>

  <text class="m" x="470" y="1004">Mapeo de servidores: Nivel infraestructura + Sistema (los 12 "Transversal" y 1 sin dato, repartidos por Sistema) · total 58</text>

</svg>
</body>
