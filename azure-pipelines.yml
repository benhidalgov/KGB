trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Python 3.12'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Instalar dependencias'

- script: |
    python tests/check_security_high.py
    python tests/check_nivel1.py
    python tests/check_auditoria_log.py
    python tests/check_auth_versionado.py
    python tests/check_visor_imagenes.py
  displayName: 'Checks de seguridad y regresión'
