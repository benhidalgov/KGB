services:
  postgres_db:
    image: postgres:16-alpine
    container_name: infra_copilot_postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infra_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-infra_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no esta definido. Copie .env.example a .env y complete los valores.}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra_admin} -d ${POSTGRES_DB:-infra_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red_infraestructura

  copilot_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infra_copilot_web
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      # Modo producción: exige credenciales maestras y clave de bóveda explícitas,
      # y falla de forma visible si PostgreSQL no está disponible.
      - PRODUCCION=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-infra_admin}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB:-infra_copilot}
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-infra_copilot}
      - DB_USER=${POSTGRES_USER:-infra_admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - OPERADOR_PASSWORD=${OPERADOR_PASSWORD:-}
      - AUDITOR_PASSWORD=${AUDITOR_PASSWORD:-}
    volumes:
      # El entrypoint corrige la propiedad del punto de montaje y baja privilegios,
      # por lo que ./data puede pertenecer al usuario del host.
      - ./data:/app/data
    ports:
      - "${APP_PORT:-8501}:8501"
    networks:
      - red_infraestructura

volumes:
  pgdata:
    name: infra_copilot_pgdata

networks:
  red_infraestructura:
    name: red_infraestructura_copilot
    driver: bridge
